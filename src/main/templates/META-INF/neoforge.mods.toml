modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Drehverschluss/RunelessRPG/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Drehverschluss/RunelessRPG"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="spell_engine"
    type="required"
    versionRange="${spell_engine_version_range}"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"

# Optional: loaded after Miki's HUD so the bar can be drawn in front of it (drawBehindMikiHud = false)
[[dependencies.${mod_id}]]
    modId="mikis_hud"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

# Optional: our affix type and affixes register only when Apotheosis is present
[[dependencies.${mod_id}]]
    modId="apotheosis"
    type="optional"
    versionRange="${apotheosis_version_range}"
    ordering="AFTER"
    side="BOTH"
